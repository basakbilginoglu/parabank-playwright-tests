name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PARABANK_USERNAME: ${{ secrets.PARABANK_USERNAME }}
      PARABANK_PASSWORD: ${{ secrets.PARABANK_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          [ -n "$PARABANK_USERNAME" ] || { echo "PARABANK_USERNAME is empty"; exit 1; }
          [ -n "$PARABANK_PASSWORD" ] || { echo "PARABANK_PASSWORD is empty"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Pull ParaBank image
        run: |
          docker pull parasoft/parabank@sha256:0de7bbc8eb0f7ba61579421df1fc834fd7f559c08bf295597c0f9081e0a906e9

      - name: Verify ParaBank image
        run: |
          docker image inspect \
            parasoft/parabank@sha256:0de7bbc8eb0f7ba61579421df1fc834fd7f559c08bf295597c0f9081e0a906e9 \
            --format='ID={{.Id}} OS={{.Os}} Architecture={{.Architecture}} RepoDigests={{json .RepoDigests}}'

      - name: Start ParaBank
        run: |
          docker run -d \
            --name parabank \
            -p 8080:8080 \
            parasoft/parabank@sha256:0de7bbc8eb0f7ba61579421df1fc834fd7f559c08bf295597c0f9081e0a906e9

      - name: Wait for ParaBank
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8080/parabank/index.htm > /dev/null \
               && curl --fail --silent http://localhost:8080/parabank/register.htm > /dev/null; then