name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PARABANK_USERNAME: ${{ secrets.PARABANK_USERNAME }}
      PARABANK_PASSWORD: ${{ secrets.PARABANK_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect ParaBank image
        run: |
          docker pull parasoft/parabank:latest
          docker image inspect parasoft/parabank:latest \
            --format 'Image ID: {{.Id}} | OS: {{.Os}} | Architecture: {{.Architecture}} | Digests: {{json .RepoDigests}}'

      - name: Start ParaBank
        run: |
          docker run -d \
            --name parabank \
            -p 8080:8080 \
            parasoft/parabank:latest

      
      - name: Wait for ParaBank
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8080/parabank/index.htm > /dev/null; then
              echo "ParaBank HTTP endpoint is responding."
              exit 0
            fi
            sleep 2
          done

          echo "ParaBank did not become available."
          docker logs parabank
          exit 1


      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Show ParaBank logs on failure
        if: failure()
        run: docker logs parabank

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30