
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PARABANK_USERNAME: ${{ secrets.PARABANK_USERNAME }}
      PARABANK_PASSWORD: ${{ secrets.PARABANK_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Pull ParaBank image
        run: |
          docker pull parasoft/parabank@sha256:0de7bbc8eb0f7ba61579421df1fc834fd7f559c08bf295597c0f9081e0a906e9

      - name: Verify ParaBank image
        run: |
          docker image inspect \
            parasoft/parabank@sha256:0de7bbc8eb0f7ba61579421df1fc834fd7f559c08bf295597c0f9081e0a906e9 \
            --format='ID={{.Id}} OS={{.Os}} Architecture={{.Architecture}} RepoDigests={{json .RepoDigests}}'

      - name: Start ParaBank
        run: |
          docker run -d \
            --name parabank \
            -p 8080:8080 \
            parasoft/parabank@sha256:0de7bbc8eb0f7ba61579421df1fc834fd7f559c08bf295597c0f9081e0a906e9

      - name: Wait for ParaBank
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8080/parabank/index.htm > /dev/null; then
              echo "ParaBank HTTP endpoint is responding."
              exit 0
            fi
            sleep 2
          done

          echo "ParaBank did not become available."
          docker logs parabank
          exit 1

      - name: Inspect ParaBank database startup
        run: |
          docker logs parabank 2>&1 | grep -i -E \
            "Database not yet initialized|HSQL Server|Database.*opened|SEQUENCE|ERROR" \
            || true

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run Playwright tests
        run: npx playwright test

      - name: ParaBank logs on failure
        if: failure()
        run: docker logs parabank

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
